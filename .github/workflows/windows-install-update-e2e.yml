name: Windows install + update E2E

# PR-time native Windows install/update journey (tests/e2e/core/windows_update):
# the real scripts/install.ps1 on a fresh fake user profile (git redirected to a local
# bare clone, no git/python/uv on PATH), then the real `hermes update` HEAD -> NEXT,
# a running gateway across that update, and a turn against the loopback provider.
# Each file walks one journey (one install) and asserts several user-visible cells;
# tracked bugs are message-gated xfails (tests/e2e/core/_pending_fixes.py).
#
# Independent affected-path/nightly coverage, outside the ordinary PR aggregate.
# Release and explicit acceptance callers still require the full journey.
# wine2e-install/** pushes keep the existing standalone iteration path.

on:
  workflow_call:
    inputs:
      force_run:
        description: Explicit reusable-workflow callers require the full suite regardless of PR applicability.
        type: boolean
        required: false
        default: true
      strict_acceptance:
        description: >-
          Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing ('upd-txn', a comma list, or '1' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).
        type: string
        required: false
        default: ''
  # The existing ownership-derived classifier gates the job, not a stale glob list.
  pull_request:
  schedule:
    - cron: '15 17 * * *'
  # An acceptance run of an integrated batch on its own: e.g.
  # `gh workflow run windows-install-update-e2e.yml --ref <branch> -f strict_acceptance=upd-txn`.
  workflow_dispatch:
    inputs:
      strict_acceptance:
        description: >-
          Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing ('upd-txn', a comma list, or '1' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).
        type: string
        required: false
        default: ''
  push:
    branches: ['wine2e-install/**']

permissions:
  contents: read

concurrency:
  group: windows-install-update-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      e2e_upgrade: ${{ steps.classify.outputs.e2e_upgrade }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Classify affected update paths
        id: classify
        if: github.event_name == 'pull_request' && !inputs.force_run
        uses: ./.github/actions/detect-changes

  install-update:
    needs: detect
    if: inputs.force_run || github.event_name != 'pull_request' || needs.detect.outputs.e2e_upgrade == 'true'
    name: Windows install.ps1 + hermes update E2E (${{ matrix.slice }})
    runs-on: ${{ github.repository == 'NousResearch/hermes-agent' && 'windows-latest-32-core' || 'windows-latest' }}
    # A typical run is ~17 min; one slow runner took 28 min for the same work (run 36295230146).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(github.repository == 'NousResearch/hermes-agent' && '["1/1"]' || '["1/3","2/3","3/3"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # serve.git is a bare clone of this checkout: the installer's treeless clone and
          # `hermes update` need real history and release tags (version identity), as on GitHub.
          fetch-depth: 0

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: git,ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run Windows install + update E2E
        id: e2e
        shell: bash
        run: |
          "$HERMES_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from scripts.run_tests_parallel import _discover_files, _slice_files
          root = Path.cwd()
          files = _discover_files([root / 'tests/e2e/core/windows_update'])
          if not any(path.name == 'test_crash_cells.py' for path in files):
              raise SystemExit('test_crash_cells.py is missing from the Windows E2E file set')
          index, count = map(int, os.environ['HERMES_TEST_SLICE'].split('/'))
          selected = _slice_files(files, index, count, {}, root)
          crash_selected = any(path.name == 'test_crash_cells.py' for path in selected)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'crash_cells_selected={str(crash_selected).lower()}\n')
          PY
          scripts/run_tests.sh tests/e2e/core/windows_update/ -- \
            -m "platforms and integration" -v --tb=short -rA
        env:
          HERMES_E2E_WINDOWS_INSTALL: '1'
          HERMES_E2E_STRICT_ACCEPTANCE: ${{ inputs.strict_acceptance }}
          # Machine work dirs (serve.git, transcripts) stay short under runner.temp. The fake
          # user profiles live in C:\Users itself, where a real one does: the checkout carries
          # 159-character paths, so a deeper profile hits MAX_PATH where no user would (the
          # runner is disposable, so writing C:\Users is fine).
          HERMES_E2E_MACHINE_ROOT: ${{ runner.temp }}\wm
          HERMES_E2E_PROFILES_ROOT: C:\Users
          HERMES_E2E_ARTIFACTS: ${{ runner.temp }}\win-update-e2e
          # One journey per file, all in parallel (each is mostly network + subprocess wait).
          HERMES_TEST_WORKERS: ${{ github.repository == 'NousResearch/hermes-agent' && '6' || '2' }}
          HERMES_TEST_SLICE: ${{ matrix.slice }}
          # test_crash_cells.py runs its whole journey (install, gateway phase, six crash cells)
          # inside one file: ~2,100 s on a normal runner, past 2,400 s on a slow one.
          HERMES_TEST_FILE_TIMEOUT: '3600'
          HERMES_TEST_FILE_RETRIES: '0'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Every crash cell ran
        if: steps.e2e.outputs.crash_cells_selected == 'true'
        # run_tests.sh passes a file whose tests were all deselected (pytest exit 5) or skipped,
        # so a lost marker or opt-in would run zero crash cells green. The crash journey writes
        # this manifest only when it ran (tests/e2e/core/windows_update/test_crash_cells.py).
        shell: pwsh
        env:
          HERMES_E2E_ARTIFACTS: ${{ runner.temp }}\win-update-e2e
        run: |
          $manifest = Join-Path $env:HERMES_E2E_ARTIFACTS 'crash-cells-ran.txt'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "test_crash_cells.py ran no crash cells: $manifest is missing"
          }
          Get-Content -LiteralPath $manifest

      - name: Upload transcripts, logs and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-install-update-e2e-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/win-update-e2e
          if-no-files-found: ignore
          retention-days: 14

      - name: No leftover Python / Hermes processes
        # Backstop for each journey's teardown: nothing a machine started may outlive it.
        if: always()
        shell: pwsh
        run: |
          $names = 'python.exe', 'pythonw.exe', 'hermes.exe', 'node.exe'
          # Work dirs live under runner.temp\wm; profiles are C:\Users\*hermes-e2e-<id>.
          $root = "${{ runner.temp }}\wm".ToLower()
          $profileMark = 'hermes-e2e-'
          $deadline = (Get-Date).AddSeconds(20)
          do {
            $left = @(Get-CimInstance Win32_Process | Where-Object {
              $blob = "$($_.CommandLine) $($_.ExecutablePath)".ToLower()
              ($names -contains $_.Name.ToLower()) -and ($blob.Contains($root) -or $blob.Contains($profileMark))
            })
            if ($left.Count -eq 0) { 'no leftover processes from the E2E machines'; exit 0 }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          foreach ($p in $left) {
            "::error::leftover pid=$($p.ProcessId) ppid=$($p.ParentProcessId): $($p.CommandLine)"
          }
          exit 1
