name: Kanban terminal guard hotfix regression

on:
  pull_request:
    paths:
      - "agent/turn_stop_gates.py"
      - "agent/turn_api_request.py"
      - "tests/agent/test_kanban_terminal_request.py"
      - ".github/workflows/kanban-stop-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-shot-terminal-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Build isolated Hermes test environment
        run: python -m pm.build_env --source . --out .venv --group dev --group test
      - name: Run behavior regression through project runner
        run: scripts/run_tests.sh tests/agent/test_kanban_terminal_request.py
